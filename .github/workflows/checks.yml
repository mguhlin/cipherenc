name: CipherEnc checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go test -mod=readonly -race ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly -trimpath -o cipherenc-smoke .
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libxcursor1
          python3 -m pip install --user -r scripts/requirements-native-tests.txt
          mkdir -p build
          go build -mod=readonly -o build/CipherEnc-native .
          xvfb-run -a build/CipherEnc-native --ui-smoke "$RUNNER_TEMP/cipherenc-ui"
          xvfb-run -a python3 scripts/check-native-drop.py

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: python3 scripts/update-integrity.py --check
      - run: npm test
      - run: node android/test-bridge.cjs
